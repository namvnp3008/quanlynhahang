# Thay cho proxy của Vite dev server (linmour-mobile-web/vite.config.ts).
# Các đường dẫn API khớp tiền tố giống Vite (vd. /order khớp cả /orders) và đi tới gateway.

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# Dùng resolver của Docker + biến để nginx vẫn khởi động được khi gateway chưa lên
# (sau khi bật máy, thứ tự container tự khởi động không được đảm bảo).
resolver 127.0.0.11 valid=10s ipv6=off;

server {
    listen 5181;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 200m;

    # Giống Vite: changeOrigin + ép Origin http://localhost:5173 (đã nằm trong CORS whitelist của gateway)
    set $proxy_origin "http://localhost:5173";
    set $gateway_upstream "http://gateway:12800";

    location /websocket {
        proxy_pass $gateway_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host gateway:12800;
        proxy_set_header Origin $proxy_origin;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location ~ ^/(app|system|product|restaurant|order|file|dataAnaly) {
        proxy_pass $gateway_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host gateway:12800;
        proxy_set_header Origin $proxy_origin;
        proxy_read_timeout 120s;
    }

    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
