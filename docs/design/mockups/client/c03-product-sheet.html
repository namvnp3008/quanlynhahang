<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mockup C03: Bottom Sheet Chọn Tuỳ Chọn Món</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Be Vietnam Pro', sans-serif; }
  </style>
</head>
<body class="bg-slate-200 text-slate-900 min-h-screen flex flex-col items-center p-0 md:p-6">

  <!-- Mobile Frame 375x812 -->
  <div class="w-full max-w-[375px] h-[812px] bg-slate-800/60 relative flex flex-col shadow-2xl rounded-3xl overflow-hidden border-4 border-slate-800">
    
    <!-- Dimmed Background Menu Preview -->
    <div class="absolute inset-0 bg-slate-900/40 backdrop-blur-2xs pointer-events-none"></div>

    <!-- Bottom Sheet Container (Rounded-t-3xl) -->
    <div class="mt-auto w-full max-h-[720px] bg-white rounded-t-3xl shadow-2xl flex flex-col z-20 overflow-hidden animate-slide-up">
      
      <!-- Sheet Handle & Close -->
      <div class="p-4 pb-2 border-b border-slate-100 flex items-center justify-between">
        <div class="flex items-center gap-3">
          <div class="w-14 h-14 rounded-2xl bg-amber-50 border border-amber-100 flex items-center justify-center text-3xl">
            🍜
          </div>
          <div>
            <h3 class="font-bold text-slate-900 text-base">Phở Bò Tái Nạm</h3>
            <div class="text-xs text-slate-500">Giá gốc: <span class="font-bold text-red-600">55.000 đ</span></div>
          </div>
        </div>
        <button class="min-w-[44px] min-h-[44px] p-2 rounded-full bg-slate-100 hover:bg-slate-200 text-slate-600 flex items-center justify-center transition" title="Đóng">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/></svg>
        </button>
      </div>

      <!-- Sheet Scrollable Options Form -->
      <div class="flex-1 overflow-y-auto p-4 space-y-5">
        
        <!-- Group 1: Kích cỡ tô (Radio single-choice) -->
        <div class="space-y-2">
          <div class="flex items-center justify-between">
            <span class="text-xs font-bold text-slate-900 uppercase tracking-wider">1. Kích Cỡ Tô</span>
            <span class="text-xs font-bold text-red-600 bg-red-50 px-2 py-0.5 rounded">Bắt buộc</span>
          </div>
          <div class="grid grid-cols-2 gap-2">
            <label class="min-h-[44px] p-2.5 rounded-xl border border-slate-200 flex items-center justify-between cursor-pointer hover:bg-slate-50">
              <span class="text-xs font-semibold text-slate-800">Tô Vừa</span>
              <span class="text-xs text-slate-500 font-medium">+0 đ</span>
            </label>
            <label class="min-h-[44px] p-2.5 rounded-xl border-2 border-red-600 bg-red-50/50 flex items-center justify-between cursor-pointer">
              <span class="text-xs font-bold text-red-700">Tô Lớn</span>
              <span class="text-xs font-bold text-red-600">+10.000 đ</span>
            </label>
          </div>
        </div>

        <!-- Group 2: Bánh phở (Radio single-choice) -->
        <div class="space-y-2">
          <div class="flex items-center justify-between">
            <span class="text-xs font-bold text-slate-900 uppercase tracking-wider">2. Lượng Bánh Phở</span>
            <span class="text-xs text-slate-400">Chọn 1</span>
          </div>
          <div class="flex flex-wrap gap-2">
            <span class="min-h-[44px] px-3.5 py-2.5 rounded-xl border border-slate-200 text-xs font-medium text-slate-700 flex items-center cursor-pointer">
              Bình thường
            </span>
            <span class="min-h-[44px] px-3.5 py-2.5 rounded-xl border-2 border-red-600 bg-red-50/50 text-xs font-bold text-red-700 flex items-center cursor-pointer">
              Ít bánh phở
            </span>
            <span class="min-h-[44px] px-3.5 py-2.5 rounded-xl border border-slate-200 text-xs font-medium text-slate-700 flex items-center cursor-pointer">
              Nhiều bánh (+5.000 đ)
            </span>
          </div>
        </div>

        <!-- Group 3: Topping ăn kèm (Checkbox multi-choice) -->
        <div class="space-y-2">
          <div class="flex items-center justify-between">
            <span class="text-xs font-bold text-slate-900 uppercase tracking-wider">3. Topping Thêm</span>
            <span class="text-xs text-slate-400">Chọn nhiều</span>
          </div>
          <div class="space-y-2">
            <label class="min-h-[44px] p-3 rounded-xl border-2 border-red-600 bg-red-50/50 flex items-center justify-between cursor-pointer">
              <div class="flex items-center gap-2.5">
                <span class="w-5 h-5 rounded-md bg-red-600 text-white flex items-center justify-center text-xs font-bold">✓</span>
                <span class="text-xs font-bold text-slate-900">Trứng chần lòng đào</span>
              </div>
              <span class="text-xs font-bold text-red-600">+7.000 đ</span>
            </label>
            <label class="min-h-[44px] p-3 rounded-xl border border-slate-200 flex items-center justify-between cursor-pointer hover:bg-slate-50">
              <div class="flex items-center gap-2.5">
                <span class="w-5 h-5 rounded-md border border-slate-300 bg-white"></span>
                <span class="text-xs font-semibold text-slate-700">Đĩa quẩy giòn (3 chiếc)</span>
              </div>
              <span class="text-xs text-slate-500 font-medium">+5.000 đ</span>
            </label>
          </div>
        </div>

        <!-- Group 4: Ghi chú đặc biệt -->
        <div class="space-y-1.5">
          <label class="text-xs font-bold text-slate-700">Ghi chú cho bếp:</label>
          <input type="text" placeholder="Ví dụ: Không hành, nhiều nước béo, đĩa ớt riêng..." class="w-full px-3.5 py-2.5 bg-slate-50 border border-slate-200 rounded-xl text-xs font-medium text-slate-900 focus:outline-none focus:border-red-600 focus:bg-white" />
        </div>

      </div>

      <!-- Sheet Footer: Stepper & Add to Cart Button (Live Price Calculation) -->
      <div class="p-4 border-t border-slate-200 bg-white space-y-3">
        <div class="flex items-center justify-between">
          <span class="text-xs font-semibold text-slate-600">Số lượng:</span>
          <div class="flex items-center gap-1 bg-slate-100 rounded-xl p-1">
            <button class="w-11 h-11 rounded-lg bg-white text-slate-800 font-extrabold text-base flex items-center justify-center shadow-xs">
              −
            </button>
            <span class="w-8 text-center font-bold text-xs text-slate-900">1</span>
            <button class="w-11 h-11 rounded-lg bg-red-600 text-white font-extrabold text-base flex items-center justify-center shadow-xs">
              +
            </button>
          </div>
        </div>

        <!-- Add Button with Summed Price: 55k + 10k + 7k = 72k -->
        <button class="w-full min-h-[48px] py-3 bg-red-600 hover:bg-red-700 text-white font-bold text-sm rounded-xl shadow-md flex items-center justify-center gap-2 transition active:scale-95">
          <span>Thêm Vào Giỏ Hàng</span>
          <span>•</span>
          <span>72.000 đ</span>
        </button>
      </div>

    </div>

  </div>

</body>
</html>
