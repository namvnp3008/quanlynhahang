<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mockup C07: Chọn Phương Thức Thanh Toán</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Be Vietnam Pro', sans-serif; }
  </style>
</head>
<body class="bg-slate-200 text-slate-900 min-h-screen flex flex-col items-center p-0 md:p-6">

  <!-- Interactive Control Bar for Reviewer -->
  <div class="w-full max-w-[420px] bg-slate-900 text-white p-3 rounded-b-2xl md:rounded-2xl mb-4 shadow-lg flex flex-col gap-2">
    <div class="flex items-center justify-between text-xs font-semibold">
      <span class="text-amber-400">⚡ Chuyển đổi phương thức thanh toán:</span>
      <span class="text-slate-400">Mobile 375×812</span>
    </div>
    <div class="grid grid-cols-2 gap-2 text-xs">
      <button onclick="setPaymentMode('payos')" id="btn-payos" class="py-2 px-2 bg-red-600 text-white font-bold rounded-xl transition">1. Mốc 2: Có PayOS</button>
      <button onclick="setPaymentMode('mvp')" id="btn-mvp" class="py-2 px-2 bg-slate-800 hover:bg-slate-700 text-slate-300 font-medium rounded-xl transition">2. Mốc 1 (MVP): Không PayOS</button>
    </div>
  </div>

  <!-- Mobile Frame 375x812 -->
  <div class="w-full max-w-[375px] h-[812px] bg-slate-50 relative flex flex-col shadow-2xl rounded-3xl overflow-hidden border-4 border-slate-800">
    
    <!-- Top System Status Bar -->
    <div class="h-6 bg-white flex items-center justify-between px-6 text-xs font-semibold text-slate-800 select-none">
      <span>14:30</span>
      <div class="flex items-center gap-1.5">
        <svg class="w-3.5 h-3.5" fill="currentColor" viewBox="0 0 24 24"><path d="M12 3c-4.97 0-9 4.03-9 9 0 2.12.74 4.07 1.97 5.61L4.35 19.4c-.39.39-.39 1.02 0 1.41.39.39 1.02.39 1.41 0l1.9-1.9C9.28 19.57 10.6 20 12 20c4.97 0 9-4.03 9-9s-4.03-9-9-9z"/></svg>
        <span>5G</span>
        <div class="w-5 h-2.5 border border-slate-700 rounded-sm p-0.5"><div class="h-full bg-slate-800 rounded-2xs w-3/4"></div></div>
      </div>
    </div>

    <!-- Header -->
    <header class="px-4 py-3 bg-white border-b border-slate-200 flex items-center gap-3 flex-shrink-0">
      <button onclick="window.history.back()" class="min-w-[40px] min-h-[40px] p-2 rounded-xl text-slate-600 hover:bg-slate-100 flex items-center justify-center">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"/></svg>
      </button>
      <div>
        <h2 class="text-base font-bold text-slate-900 leading-tight">Thanh Toán Hoá Đơn</h2>
        <div class="text-xs text-slate-500">Bàn số 03 • Nhà Hàng Bếp Việt</div>
      </div>
    </header>

    <!-- Main Payment Selection -->
    <main class="flex-1 overflow-y-auto p-4 space-y-5">
      
      <!-- Total Due Box -->
      <div class="bg-white p-5 rounded-2xl border border-slate-200 shadow-xs text-center space-y-1">
        <span class="text-xs font-semibold text-slate-500">Số tiền cần thanh toán</span>
        <div class="text-3xl font-black text-red-600">147.000 đ</div>
        <div class="text-xs text-slate-400">Đơn hàng #ORD-102938 • 3 món</div>
      </div>

      <!-- Payment Methods (C8, Y4) -->
      <div class="space-y-3">
        <div class="text-xs font-bold text-slate-600 uppercase tracking-wider px-1">Chọn Phương Thức Thanh Toán</div>

        <!-- Option 1: PayOS (Online QR - Mốc 2) -->
        <label id="opt-payos" class="p-3.5 rounded-2xl border-2 border-red-600 bg-red-50/40 flex items-center justify-between cursor-pointer shadow-xs transition">
          <div class="flex items-center gap-3">
            <div class="w-11 h-11 rounded-xl bg-red-100 text-red-600 flex items-center justify-center text-xl font-bold flex-shrink-0">
              ⚡
            </div>
            <div>
              <div class="flex items-center gap-1.5">
                <span class="font-bold text-slate-900 text-sm">Chuyển Khoản Tự Động (PayOS)</span>
                <span class="text-xs font-bold bg-red-600 text-white px-2 py-0.5 rounded-full">Khuyên dùng</span>
              </div>
              <p class="text-xs text-slate-500 mt-0.5">Quét mã VietQR bằng app ngân hàng, tự động xác nhận khi nhận được tiền</p>
            </div>
          </div>
          <span id="check-payos" class="w-5 h-5 rounded-full bg-red-600 text-white flex items-center justify-center text-xs font-bold">✓</span>
        </label>

        <!-- Option 2: VietQR Static (Manual) -->
        <label id="opt-vietqr" class="p-3.5 rounded-2xl border border-slate-200 bg-white hover:border-slate-300 flex items-center justify-between cursor-pointer transition">
          <div class="flex items-center gap-3">
            <div class="w-11 h-11 rounded-xl bg-blue-50 text-blue-600 flex items-center justify-center text-xl font-bold flex-shrink-0">
              🏦
            </div>
            <div>
              <span class="font-bold text-slate-900 text-sm">VietQR Chuyển Khoản Thủ Công</span>
              <p class="text-xs text-slate-500 mt-0.5">Quét mã QR của quán, nhân viên sẽ tới bàn đối soát bill</p>
            </div>
          </div>
          <span id="check-vietqr" class="w-5 h-5 rounded-full border border-slate-300 bg-white"></span>
        </label>

        <!-- Option 3: Tiền Mặt -->
        <label id="opt-cash" class="p-3.5 rounded-2xl border border-slate-200 bg-white hover:border-slate-300 flex items-center justify-between cursor-pointer transition">
          <div class="flex items-center gap-3">
            <div class="w-11 h-11 rounded-xl bg-amber-50 text-amber-600 flex items-center justify-center text-xl font-bold flex-shrink-0">
              💵
            </div>
            <div>
              <span class="font-bold text-slate-900 text-sm">Tiền Mặt Tại Bàn</span>
              <p class="text-xs text-slate-500 mt-0.5">Nhân viên phục vụ sẽ mang hóa đơn và tiền thừa tới tận bàn</p>
            </div>
          </div>
          <span id="check-cash" class="w-5 h-5 rounded-full border border-slate-300 bg-white"></span>
        </label>

      </div>

    </main>

    <!-- Footer Action -->
    <footer class="p-4 border-t border-slate-200 bg-white space-y-2 flex-shrink-0 shadow-lg">
      <button onclick="window.location.href='c08-payos-qr.html'" class="w-full min-h-[48px] py-3.5 bg-red-600 hover:bg-red-700 text-white font-bold text-sm rounded-xl shadow-md transition active:scale-95 flex items-center justify-center gap-2">
        <span>Tiếp Tục Thanh Toán</span>
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14 5l7 7m0 0l-7 7m7-7H3"/></svg>
      </button>
      <div class="text-xs text-center text-slate-500">Giao dịch được bảo mật & mã hóa an toàn</div>
    </footer>

  </div>

  <script>
    function setPaymentMode(mode) {
      const btnPayos = document.getElementById('btn-payos');
      const btnMvp = document.getElementById('btn-mvp');
      const optPayos = document.getElementById('opt-payos');
      const optVietqr = document.getElementById('opt-vietqr');
      const checkPayos = document.getElementById('check-payos');
      const checkVietqr = document.getElementById('check-vietqr');

      if (mode === 'mvp') {
        btnMvp.className = 'py-2 px-2 bg-red-600 text-white font-bold rounded-xl transition';
        btnPayos.className = 'py-2 px-2 bg-slate-800 hover:bg-slate-700 text-slate-300 font-medium rounded-xl transition';
        optPayos.classList.add('hidden');
        optVietqr.className = 'p-3.5 rounded-2xl border-2 border-red-600 bg-red-50/40 flex items-center justify-between cursor-pointer shadow-xs transition';
        checkVietqr.className = 'w-5 h-5 rounded-full bg-red-600 text-white flex items-center justify-center text-xs font-bold';
        checkVietqr.innerText = '✓';
      } else {
        btnPayos.className = 'py-2 px-2 bg-red-600 text-white font-bold rounded-xl transition';
        btnMvp.className = 'py-2 px-2 bg-slate-800 hover:bg-slate-700 text-slate-300 font-medium rounded-xl transition';
        optPayos.classList.remove('hidden');
        optPayos.className = 'p-3.5 rounded-2xl border-2 border-red-600 bg-red-50/40 flex items-center justify-between cursor-pointer shadow-xs transition';
        optVietqr.className = 'p-3.5 rounded-2xl border border-slate-200 bg-white hover:border-slate-300 flex items-center justify-between cursor-pointer transition';
        checkVietqr.className = 'w-5 h-5 rounded-full border border-slate-300 bg-white';
        checkVietqr.innerText = '';
      }
    }
  </script>
</body>
</html>
