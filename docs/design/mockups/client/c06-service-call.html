<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mockup C06: Gọi Nhân Viên Phục Vụ</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Be Vietnam Pro', sans-serif; }
  </style>
</head>
<body class="bg-slate-200 text-slate-900 min-h-screen flex flex-col items-center p-0 md:p-6">

  <!-- Mobile Frame 375x812 -->
  <div class="w-full max-w-[375px] h-[812px] bg-slate-900/60 relative flex flex-col shadow-2xl rounded-3xl overflow-hidden border-4 border-slate-800">
    
    <!-- Dimmed Background -->
    <div class="absolute inset-0 bg-slate-900/50 backdrop-blur-2xs"></div>

    <!-- Bottom Sheet Container (B2) -->
    <div class="mt-auto w-full bg-white rounded-t-3xl shadow-2xl flex flex-col z-20 p-5 space-y-5 animate-slide-up">
      
      <!-- Sheet Header -->
      <div class="flex items-center justify-between border-b pb-3 border-slate-100">
        <div class="flex items-center gap-2">
          <div class="w-9 h-9 rounded-xl bg-amber-50 text-amber-700 flex items-center justify-center text-lg">
            🔔
          </div>
          <div>
            <h3 class="font-bold text-slate-900 text-base">Gọi Nhân Viên – Bàn 03</h3>
            <p class="text-xs text-slate-500">Yêu cầu sẽ được gửi tức thì tới quầy phục vụ</p>
          </div>
        </div>
        <button class="min-w-[40px] min-h-[40px] p-2 rounded-full text-slate-400 hover:text-slate-600 flex items-center justify-center">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/></svg>
        </button>
      </div>

      <!-- Quick Choices Grid -->
      <div class="space-y-2">
        <label class="text-xs font-bold text-slate-700">Yêu cầu nhanh:</label>
        <div class="grid grid-cols-2 gap-2.5">
          <button class="min-h-[44px] p-3 rounded-xl border-2 border-red-600 bg-red-50/50 text-xs font-bold text-red-700 flex items-center gap-2 text-left">
            <span>🧊</span> Xin thêm nước đá
          </button>
          <button class="min-h-[44px] p-3 rounded-xl border border-slate-200 hover:border-slate-300 text-xs font-semibold text-slate-700 flex items-center gap-2 text-left">
            <span>🥢</span> Lấy thêm đũa & thìa
          </button>
          <button class="min-h-[44px] p-3 rounded-xl border border-slate-200 hover:border-slate-300 text-xs font-semibold text-slate-700 flex items-center gap-2 text-left">
            <span>🧻</span> Xin thêm khăn giấy
          </button>
          <button onclick="window.location.href='c07-payment.html'" class="min-h-[44px] p-3 rounded-xl border border-red-200 bg-red-50/50 hover:bg-red-50 text-xs font-bold text-red-700 flex items-center justify-between text-left">
            <span class="flex items-center gap-2"><span>💳</span> Gọi thanh toán</span>
            <span class="text-2xs">Mở thanh toán →</span>
          </button>
        </div>
      </div>

      <!-- Custom Request Text Input -->
      <div class="space-y-1.5">
        <label class="text-xs font-bold text-slate-700">Yêu cầu khác (nếu có):</label>
        <input type="text" placeholder="Nhập yêu cầu riêng của bạn..." class="w-full px-3.5 py-2.5 bg-slate-50 border border-slate-200 rounded-xl text-xs font-medium text-slate-900 focus:outline-none focus:border-red-600 focus:bg-white" />
      </div>

      <!-- Action Button -->
      <div class="pt-2">
        <button onclick="alert('Đã gửi thông báo tới nhân viên!');" class="w-full min-h-[48px] py-3.5 bg-red-600 hover:bg-red-700 text-white font-bold text-sm rounded-xl shadow-md transition active:scale-95 flex items-center justify-center gap-2">
          <span>Gửi Yêu Cầu Tới Nhân Viên</span>
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 19l9 2-9-18-9 18 9-2zm0 0v-8"/></svg>
        </button>
      </div>

    </div>

  </div>

</body>
</html>
